components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Locale:
      type: string
      enum: [en, ar]

    LeadStatus:
      type: string
      enum: [new, contacted, closed]

    CreateLeadRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        company:
          type: string
        service:
          type: string
        message:
          type: string
          minLength: 1
        locale:
          $ref: "#/components/schemas/Locale"
        # Honeypot field: must arrive empty. A real browser with the field
        # hidden via CSS never fills it in; bots that autofill every input do.
        website:
          type: string
      required:
        - name
        - email
        - message

    Lead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        service:
          type: string
          nullable: true
        message:
          type: string
        sourcePage:
          type: string
          nullable: true
        locale:
          $ref: "#/components/schemas/Locale"
        status:
          $ref: "#/components/schemas/LeadStatus"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - message
        - locale
        - status
        - createdAt

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password

    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
      required:
        - id
        - email
        - name

    ArticleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        category:
          type: string
        coverImage:
          type: string
          nullable: true
        featured:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        title:
          type: string
        excerpt:
          type: string
      required:
        - id
        - slug
        - category
        - featured
        - title
        - excerpt

    ArticleDetail:
      allOf:
        - $ref: "#/components/schemas/ArticleSummary"
        - type: object
          properties:
            status:
              type: string
              enum: [draft, published]
            body:
              type: string
          required:
            - status
            - body

    AdminArticle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        category:
          type: string
        coverImage:
          type: string
          nullable: true
        featured:
          type: boolean
        status:
          type: string
          enum: [draft, published]
