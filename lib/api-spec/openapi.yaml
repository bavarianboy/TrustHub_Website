  /admin/uploads:
    post:
      operationId: adminUploadImage
      tags: [admin-uploads]
      summary: Upload an image, returning its public URL (requires admin session)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Uploaded image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedImage"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/page-content/legal/{page}:
    get:
      operationId: adminGetLegalContent
      tags: [admin-page-content]
      summary: Get Privacy/Terms content in both locales (requires admin session)
