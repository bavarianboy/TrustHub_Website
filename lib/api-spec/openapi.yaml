          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: adminUpdateLegalContent
      tags: [admin-page-content]
      summary: Update Privacy/Terms content in both locales (requires admin session)
      parameters:
        - name: page
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LegalPage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLegalContent"
      responses:
        "200":
          description: Updated legal content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLegalContent"
        "401":
